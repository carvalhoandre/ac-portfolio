[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Keep legacy URL redirects ahead of the application fallback. Pre-rendered
# files still take precedence because these rules are not forced.
[[redirects]]
  from = "/portfolio"
  to = "/pt-BR/#projetos"
  status = 301

[[redirects]]
  from = "/projetos"
  to = "/pt-BR/#projetos"
  status = 301

[[redirects]]
  from = "/about"
  to = "/en/#about"
  status = 301

# Netlify must return the application shell for a client-side route that does
# not have a pre-rendered file. The in-app router then renders its own 404 for
# unknown paths instead of exposing Netlify's 404 page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
